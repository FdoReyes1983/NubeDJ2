name: android-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # fijo: "ubuntu-latest" pasa a Ubuntu 26 el 19-oct-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Resumen de errores
        if: failure()
        run: |
          echo "=== ERRORES KOTLIN / AAPT ==="
          grep -nE "^e: |error:|What went wrong" -A6 build.log | head -80 || true
      - uses: actions/upload-artifact@v4
        with:
          name: Nube-DJ2-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
